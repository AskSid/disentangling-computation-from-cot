# Softmax probe sweep - focusing on temperature parameter
params:
  data_dir: "/mnt/polished-lake/data/mmlu_activations"
  layer_idx: 32
  probe_type: "softmax"  # Fixed to softmax
  rolling_window: 5  # Not used for softmax
  softmax_temperature: 1.0  # Will be swept over
  label_type: "model_correct"
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer_type: "Adam"
  dtype: "bfloat16"
  num_epochs: 10
  train_test_split: 0.8
  output_dir: "results/"
  run_name: "softmax_temperature_sweep"
  disable_tqdm: false
  seed: 42
  device: "cuda"

# Sweep over different temperature values for softmax
sweep:
  softmax_temperature: [0.1, 0.3, 0.5, 1.0, 2.0, 5.0, 10.0]
