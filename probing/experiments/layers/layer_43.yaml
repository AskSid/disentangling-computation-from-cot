# Base parameters used for single run or as defaults for sweep overrides
params:
  train_test_split: 0.8
  batch_size: 512
  device: cuda
  label_type: model_answer   # one of: model_answer (model's predicted answer), correct_answer (the correct answer), model_correct (whether the model's prediction is correct)
  weight_decay: 0.0
  optimizer_type: Adam       # one of: Adam, SGD
  dtype: bfloat16            # the activations were saved in bfloat16 so we prob won't need to change this ever but just in case
  num_epochs: 1
  data_dir: /mnt/polished-lake/data/mmlu_activations # can also be mmlu_activations_distilled for the 8B model
  layer_idx: 43
  output_dir: /mnt/polished-lake/home/annabelma/disentangling-computation-from-cot/probing/results/ # where to save the results and models
  run_name: "last_layer_lr_sweep_layer43"

# Grid of parameters to sweep over. Any keys here override values in params.
# If it's a single run, comment out this section.
sweep:
  # batch_size: [1024, 2048, 4096]
  learning_rate: [0.01, 0.005, 0.001, 0.0005, 0.0001]
  weight_decay: [0.0, 0.0001, 0.001, 0.01, 0.1, 1]
  # optimizer_type: [Adam, SGD]
