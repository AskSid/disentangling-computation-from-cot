# Single layer experiment configuration
params:
  data_dir: "/mnt/polished-lake/data/mmlu_activations"
  layer_idx: 60  # Single layer to train on (last layer)
  probe_type: "mean"  # Choose: mean, max, last_token, rolling_means, softmax, attention
  rolling_window: 5  # For rolling_means probe
  softmax_temperature: 1.0  # For softmax probe
  label_type: "model_correct"
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer_type: "Adam"
  dtype: "bfloat16"
  num_epochs: 10
  train_test_split: 0.8
  output_dir: "results/"
  run_name: "layer_60_mean_probe"
  disable_tqdm: false
  seed: 42
  device: "cuda"
