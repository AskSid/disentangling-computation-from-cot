# Layer-wise comprehensive sweep - all layers with mean pooling for comparison
params:
  data_dir: "/mnt/polished-lake/data/mmlu_activations"
  layer_idx: 0  # Will be overridden for each layer
  probe_type: "mean"  # Fixed to mean for layer-wise comparison
  rolling_window: 5  # Not used for mean
  softmax_temperature: 1.0  # Not used for mean
  label_type: "model_correct"
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer_type: "Adam"
  dtype: "bfloat16"
  num_epochs: 15
  train_test_split: 0.8
  output_dir: "results/"
  run_name: "layerwise_mean_comparison"
  disable_tqdm: false
  seed: 42
  device: "cuda"
