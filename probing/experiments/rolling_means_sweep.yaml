# Rolling means probe sweep - focusing on window length
params:
  data_dir: "/mnt/polished-lake/data/mmlu_activations"
  layer_idx: 32
  probe_type: "rolling_means"  # Fixed to rolling_means
  rolling_window: 5  # Will be swept over
  softmax_temperature: 1.0  # Not used for rolling_means
  label_type: "model_correct"
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer_type: "Adam"
  dtype: "bfloat16"
  num_epochs: 10
  train_test_split: 0.8
  output_dir: "results/"
  run_name: "rolling_means_window_sweep"
  disable_tqdm: false
  seed: 42
  device: "cuda"

# Sweep over different window lengths for rolling means
sweep:
  rolling_window: [2, 3, 5, 7, 10, 15, 20]
