# Comprehensive sweep for layer 60 - all probe types with their optimal hyperparameters
params:
  data_dir: "/mnt/polished-lake/data/mmlu_activations"
  layer_idx: 60  # Last layer
  probe_type: "mean"  # Will be swept over
  rolling_window: 5  # Will be swept over for rolling_means
  softmax_temperature: 1.0  # Will be swept over for softmax
  label_type: "model_correct"
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer_type: "Adam"
  dtype: "bfloat16"
  num_epochs: 15  # More epochs for better results
  train_test_split: 0.8
  output_dir: "results/"
  run_name: "comprehensive_layer60_sweep"
  disable_tqdm: false
  seed: 42
  device: "cuda"

# Comprehensive sweep over all probe types and their hyperparameters
sweep:
  probe_type: 
    - "mean"
    - "max" 
    - "last_token"
    - "rolling_means"
    - "softmax"
    - "attention"
  rolling_window: [2, 3, 5, 7, 10, 15]  # For rolling_means
  softmax_temperature: [0.1, 0.5, 1.0, 2.0, 5.0]  # For softmax
