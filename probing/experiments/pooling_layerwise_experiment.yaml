# Layerwise experiment configuration for pooling probes
params:
  data_dir: "/mnt/polished-lake/data/mmlu_activations"
  layer_idx: 32  # Will be overridden for each layer in all_layers mode
  probe_type: "mean"  # Default pooling type
  rolling_window: 5  # For rolling_means probe
  softmax_temperature: 1.0  # For softmax probe
  label_type: "model_correct"
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer_type: "Adam"
  dtype: "bfloat16"
  num_epochs: 10
  train_test_split: 0.8
  output_dir: "results/"
  run_name: "pooling_layerwise_experiment"
  disable_tqdm: false
  seed: 42
  device: "cuda"
